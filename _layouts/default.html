<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#073462">
    <meta name="color-scheme" content="light">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.short_title | escape }}</title>
    <meta name="description" content="{{ site.description | strip_newlines | escape }}">
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="global-logo" aria-label="Voronoi and Delaunay logo">
      <a href="{{ '/assets/images/carousel/delone_logo.png' | relative_url }}" target="_blank" rel="noopener noreferrer">
        <img class="top-logo" src="{{ '/assets/images/carousel/delone_logo.png' | relative_url }}" alt="Voronoi and Delaunay logo">
      </a>
    </div>
    <div class="site-layout">
      <div class="left-rail">{% include header.html %}</div>
      <div class="page-column">
        {% include site-visuals.html %}
        <main id="main-content" class="main-shell"><div class="main-column">{{ content }}</div></main>
        {% include footer.html %}
      </div>
      <aside class="right-image" aria-label="Mountain image">
        <img src="{{ '/assets/images/carousel/4.jpg' | relative_url }}" alt="Snow-covered mountain" loading="lazy">
      </aside>
    </div>
    <button class="back-to-top" type="button" data-back-to-top aria-label="Back to top" title="Back to top" aria-hidden="true" tabindex="-1"><span aria-hidden="true">↑</span></button>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
