<header class="site-header" data-site-header>
  <div class="top-inner">
    <div class="site-brand-row">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="AI4Mesh home" data-home-brand>AI4Mesh</a>
      <button class="nav-toggle" type="button" aria-label="Toggle conference menu" aria-expanded="false" aria-controls="primary-menu" data-nav-toggle>
        <span class="nav-toggle-label">Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true">☰</span>
      </button>
    </div>
    <div class="nav-content" id="primary-menu" data-nav-menu>
      <nav aria-label="Primary navigation">
        <ul class="nav-list">
          <li class="nav-item"><a class="{% if page.nav_key == 'home' %}is-active{% endif %}" href="{{ '/' | relative_url }}">Home</a></li>
          <li class="nav-item"><a class="{% if page.nav_key == 'topics' %}is-active{% endif %}" href="{{ '/topics/' | relative_url }}">Topics</a></li>
          <li class="nav-item"><a class="{% if page.nav_key == 'program' %}is-active{% endif %}" href="{{ '/program/' | relative_url }}">Program</a></li>
          <li class="nav-item"><a class="{% if page.nav_key == 'registration' %}is-active{% endif %}" href="{{ '/registration/' | relative_url }}">Registration</a></li>
          <li class="nav-item"><a class="{% if page.nav_key == 'venue' %}is-active{% endif %}" href="{{ '/venue/' | relative_url }}">Venue &amp; Travel</a></li>
          <li class="nav-item"><a class="{% if page.nav_key == 'contact' %}is-active{% endif %}" href="{{ '/contact/' | relative_url }}">Contact</a></li>
          <li class="nav-item"><a class="{% if page.nav_key == 'committees' %}is-active{% endif %}" href="{{ '/committees/' | relative_url }}">Committees</a></li>
        </ul>
      </nav>
      <form class="site-search" role="search" data-site-search>
        <label class="search-label" for="site-search-input">Search this page</label>
        <input id="site-search-input" type="search" name="q" placeholder="Search" autocomplete="off" data-site-search-input>
        <button type="submit" aria-label="Search this page">
          <svg viewBox="0 0 24 24" width="25" height="25" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="m16.2 16.2 4.3 4.3"></path></svg>
        </button>
        <span class="search-status" data-site-search-status aria-live="polite"></span>
      </form>
    </div>
  </div>
</header>
