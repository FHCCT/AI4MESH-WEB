city_intro:
  - >-
    Dalian, known as the “Oriental Pearl” and the “City of Romance,” is a coastal
    gem in northeastern China where rich culture and stunning nature come
    together. It’s a top international spot, blending history, art, and modern
    vibes—perfect for cultural exchange and tourism.
  - >-
    October is the best time to visit! The weather is mild, and outdoor spots
    like Russian Street, Xinghai Square, and Binhai Road (with its amazing Yellow
    Sea views) shine even brighter. Museums and galleries show off East-West
    influences, while Lvshun Old Town’s historic buildings and autumn-colored
    streets feel like stepping into a storybook. Don’t miss the fall foliage at
    Xijiazi Red Maple Valley or Xijiao National Park, plus local seafood markets
    and art fairs. Whether you’re exploring history, enjoying nature, or tasting
    treats, Dalian promises an unforgettable trip!

