date_iso_end: "2026-10-31"
city: "Dalian, China"

objectives:
  - >-
    This workshop aims to establish an international platform for discussing the
    foundations of mesh generation theory and its applications in scientific,
    engineering, and industrial simulation, with a special focus on AI-driven
    meshing technologies and simulation methodologies. A distinctive theme of
    this workshop is the recognition and celebration of the fundamental
    contributions of Georgy Feodosyevich Voronoy (1868–1908) and Boris
    Nikolayevich Delone (1890–1980), whose work laid the geometric and
    topological foundations on which modern mesh generation and numerical
    simulation methods continue to build.
  - >-
    The workshop brings together researchers and industry practitioners to
    exchange ideas on core algorithmic developments, practical implementation
    challenges, and emerging trends across structured, unstructured, hybrid,
    adaptive, and high-order meshing paradigms.
  - >-
    Particular emphasis is placed on both application-driven and AI-driven
    meshing problems arising in discrete and differential geometry,
    computational geometry, computational topology, computational fluid
    dynamics, structural analysis, computational electromagnetics, Multiphysics
    simulation, biomedical modeling, and industrial CAE workflows. By bridging
    theoretical innovation with real-world simulation demands, this workshop
    seeks to identify critical research frontiers, facilitate vibrant technical
    exchange, and foster enduring international collaboration within the
    meshing community.

