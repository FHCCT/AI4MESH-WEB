title: "GeoTop-AI4MESH 2026"
full_title: "International Workshop on Geometry and Topology for AI-Driven Mesh Generation and Simulations"
subtitle: "In honor of the fundamental contributions of Voronoi and Delaunay"
date_display: "29–31 October 2026"
date_start_display: "29 October 2026"
date_day_range: "29–31"
