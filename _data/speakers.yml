- id: "marco-attene"
  name: "Marco Attene"
  institution: "National Research Council of Italy"
  profile_url: "https://www.imati.cnr.it/mypage.php?idk=PG-45"
  profile_label: "Homepage"
  biography:
    - "Marco Attene is a research director at the National Research Council of Italy, where he investigates new directions, paradigms and algorithms for 3D geometric modelling, processing and analysis. He regularly publishes high-impact articles in the most prestigious journals in the area (ACM TOG, TVCG, CGF, ...) with thousands of citations, and in 2024 was ranked in the top 2% most influential researchers in all fields of science. His work is regularly presented at all the major computer graphics events including ACM Siggraph and Eurographics, and he is the recipient of the SGP Software Award for his MeshFix software. Marco is an ACM professional member, is vice-president of the Italian Chapter of the Eurographics Association, served as General Chair of the Graphics Replicability Stamp Initiative, and is an associate editor of Wiley Computer Graphics Forum and Elsevier Computers & Graphics."
  talk_title: "Robust computational geometry"
  abstract:
    - "For researchers and practitioners who deal with geometric models, turning a theoretical algorithm into a reliable computer program might become a tricky and sometimes frustrating task. Even when an algorithm is provably correct, its actual implementation might still fail because it approximates real numbers with finite floating point representations. Exact geometric predicates and adaptive precision may help, but the cost in terms of performance loss can be relevant. This talk analyses and discusses how recent results have tackled this fundamental problem. Starting from Shewchuk's seminal work and CGAL approach to robustness, I will show how geometric algorithms can be made robust with virtually no performance penalty. We will see how the concept of \"indirect geometric predicate\" has enabled the development of a whole new family of modern algorithms that resolve long lasting problems within the computational geometry community, including 3D arrangements, mesh boolean operations, cascaded editing and volume meshing."
  photo_path: "/assets/images/speakers/marco-attene.jpg"

